[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docker-compose-template"
version = "0.1.0"
description = "A docker-compose dev-stack scaffolder: list curated stacks and generate valid docker-compose.yml from templates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
maintainers = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = ["docker", "docker-compose", "scaffolder", "devops", "cli", "templates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/docker-compose-template"
Issues = "https://github.com/Viprasol-Tech/docker-compose-template/issues"
Changelog = "https://github.com/Viprasol-Tech/docker-compose-template/blob/main/CHANGELOG.md"

[project.scripts]
dct = "dct.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dct"]

[tool.hatch.build.targets.wheel.force-include]
"stacks" = "dct/_stacks"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W", "C90", "SIM", "RUF"]
ignore = ["SIM108", "C901"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
